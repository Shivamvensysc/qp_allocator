version: '3.8'

services:

  db:
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: qp_allocator
    ports:
      - "3636:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    env_file:
      - .env

    depends_on:
      - db

volumes:
  mysql_data:
